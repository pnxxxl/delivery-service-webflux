<!doctype html><meta charset="utf-8"><title>Проверка Delivery WebFlux</title>
<style>body{font:18px Consolas,monospace;margin:35px;background:#f4f6fa;color:#17243b}h1{font:28px Arial}pre{white-space:pre-wrap;background:white;padding:20px;border:1px solid #ccd5e0;font-size:18px}small{font:16px Arial}</style>
<h1>Delivery Service · Spring WebFlux</h1><pre id="out">Выполнение запроса…</pre>
<script>
const out=document.querySelector('#out');const mode=new URLSearchParams(location.search).get('mode')||'create';
async function request(method,path,body){const start=performance.now();const r=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const t=await r.text();return `${method} http://localhost:8080${path}\n${body?JSON.stringify(body)+'\n':''}\nHTTP ${r.status} ${r.statusText}\nContent-Type: ${r.headers.get('content-type')}\n\n${t?JSON.stringify(JSON.parse(t),null,2):'(пустой ответ)'}\n\nВремя: ${Math.round(performance.now()-start)} мс`;}
(async()=>{try{if(mode==='create'){out.textContent=await request('POST','/api/deliveries',{orderId:1});}if(mode==='read'){out.textContent=await request('GET','/api/deliveries')+'\n\n'+await request('GET','/api/deliveries/1');}if(mode==='update'){out.textContent=await request('PUT','/api/deliveries/1',{orderId:1,status:'CREATED'});}if(mode==='error'){out.textContent=await request('GET','/api/deliveries/999');}if(mode==='sse'){out.textContent='GET http://localhost:8080/api/deliveries/1/stream\nAccept: text/event-stream\n\n';const start=performance.now();const r=await fetch('/api/deliveries/1/stream');out.textContent+=`HTTP ${r.status}\nContent-Type: ${r.headers.get('content-type')}\n\n`;const reader=r.body.getReader(),decoder=new TextDecoder();while(true){const {value,done}=await reader.read();if(done)break;out.textContent+=`[+${((performance.now()-start)/1000).toFixed(2)} с] `+decoder.decode(value,{stream:true})+'\n';}out.textContent+='Поток завершён.';}}catch(e){out.textContent+=e;}})();
</script>
